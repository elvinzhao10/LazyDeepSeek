# Bundled skills at rank 600 through the generated copied bundle. The provider
# probes a not-yet-existing root until it appears, so discovery converges
# in-boot even when the shim activates after skill-filesystem.
- id: skill-filesystem
  inject: [lazydeepseekRuntime]
  config:
    bundledSkillDir: !!js lazydeepseekRuntime.path('skills')

# Adopt the native Ralph loop as the primary fresh-agent engine (ratified Q3;
# M0 probe P-14). The base ships the row disabled; our overlay enables it with
# the family's round ceiling. `workflow` is already registered by dsh-base.
- id: tool-ralph
  disabled: false
  config:
    subagentProvider: spawn
    maxRounds: 64
